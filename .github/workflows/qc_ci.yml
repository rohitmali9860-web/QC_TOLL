name: r-pac Layout QC Automation Suite CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Core BarTender QC Test Suite (9 Suites)
      run: |
        python test_qc_suite.py

    - name: Run Template Layout Comparison Unit Tests
      run: |
        python test_template_compare.py

    - name: Run Latency & Throughput Performance Benchmark
      run: |
        python scripts/benchmark_performance.py
